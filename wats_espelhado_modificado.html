<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wats Espelhado — Demonstração</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#123d25,#07110c 58%,#030806);font-family:Arial,sans-serif;color:#f4fff7}
.card{width:min(100%,440px);padding:28px;border:1px solid #1e5b37;border-radius:22px;background:#0c1911;box-shadow:0 20px 70px #0009}
.logo{width:64px;height:64px;margin:0 auto 15px;border-radius:18px;background:linear-gradient(145deg,#2bea77,#087b39);display:grid;place-items:center;font-size:34px;font-weight:800}
h1{text-align:center;margin:0;font-size:27px}.sub{text-align:center;color:#a8b9ae;margin:9px 0 24px;font-size:14px}
label{display:block;margin:15px 0 8px;font-size:13px;font-weight:700}input{width:100%;padding:14px;border-radius:11px;border:1px solid #315440;background:#07110c;color:#fff;font-size:16px}
button{display:block;width:100%;margin-top:21px;padding:15px;border:0;border-radius:11px;background:linear-gradient(90deg,#20d96b,#0fa64d);color:#041109;font-size:16px;font-weight:800;cursor:pointer}
#checkout{display:none;margin-top:24px;padding-top:22px;border-top:1px solid #28523a}#checkout h2{text-align:center;font-size:21px;margin:0 0 8px}.desc{text-align:center;color:#b9c9bf;font-size:13px;line-height:1.5}
.qr-container{width:184px;height:184px;margin:18px auto;border:4px solid white;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff}
.qr-container img{width:100%;height:100%;object-fit:contain}
.pix{padding:12px;background:#07110c;border:1px solid #315440;border-radius:10px;text-align:center;color:#b9c9bf;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<main class="card">
<div class="logo">W</div><h1>Wats Espelhado</h1><p class="sub">Prévia demonstrativa da interface</p>
<div>
<label for="phone">NUMERO</label>
<input id="phone" type="tel" inputmode="tel" placeholder="(00) 00000-0000">
<label for="pass">SENHA</label>
<input id="pass" type="password" placeholder="Não use uma senha real" autocomplete="off">
<button id="continueBtn" type="button">CHECKOUT</button>
</div>
<section id="checkout" aria-live="polite">
<h2>Checkout</h2>
<p class="desc">Etapa de exemplo para visualizar o layout. Nenhum pagamento será solicitado ou processado.</p>
<div class="qr-container"><img src="qr ifinity.png" alt="QR Code"></div>
<div class="pix"><strong>PIX copia e cola</strong><br>78f9cff0-8c09-4316-9c68-873089e90887</div>
</section>
</main>
<script>
(function(){
  var btn = document.getElementById('continueBtn');
  var checkout = document.getElementById('checkout');
  btn.addEventListener('click', function(){
    document.getElementById('pass').value = '';
    checkout.style.display = 'block';
    btn.textContent = 'Checkout aberto';
    checkout.scrollIntoView({behavior:'auto', block:'start'});
  });
})();
</script>
</body></html>
